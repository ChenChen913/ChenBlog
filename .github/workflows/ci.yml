name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查 + 单元测试
  checks:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Lint (eslint)
        run: npx eslint .

      - name: Unit tests (vitest)
        run: npm run test:run

      # CSS 债务预算：只减不增。阈值 = 2026-10 兜底块合入后的实测基线
      # （57 占位 / 50 important / 36 z-index / 4935 行）。偿还债务后应
      # 同步下调阈值；确需上调须在 PR 中说明理由。
      - name: CSS budget check (ratchet)
        run: |
          CSS=src/index.css
          PLACEHOLDERS=$(grep -cE '/\* \((repaired comment|乱码注释已清理)\) \*/' "$CSS" || true)
          IMPORTANTS=$(grep -o '!important' "$CSS" | wc -l)
          ZINDEX=$(grep -o 'z-index:' "$CSS" | wc -l)
          LINES=$(wc -l < "$CSS")
          echo "css placeholders=$PLACEHOLDERS importants=$IMPORTANTS z-index=$ZINDEX lines=$LINES"
          test "$PLACEHOLDERS" -le 57
          test "$IMPORTANTS" -le 50
          test "$ZINDEX" -le 36
          test "$LINES" -le 4935

  # 生产构建 + 预渲染产物校验
  build:
    name: Build & Prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        run: npx playwright install chromium --with-deps

      - name: Build (vite build + prerender + rss/sitemap)
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -f dist/categories/index.html
          test -f dist/weekly/index.html
          test -f dist/posts/markdown-syntax-test/index.html
          test -f dist/posts/typescript-advanced/index.html
          test -f dist/rss.xml
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q "markdown-syntax-test" dist/sitemap.xml
          grep -q "/weekly" dist/sitemap.xml
          echo "All build artifacts verified."

      - name: Upload dist snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
          retention-days: 7

  # 端到端测试（Chromium 桌面 + 移动视口）
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
