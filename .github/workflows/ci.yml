name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查 + 单元测试
  checks:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Lint (eslint)
        run: npx eslint .

      - name: Unit tests (vitest)
        run: npm run test:run

      # CSS 债务预算：只减不增。阈值 = 2026-10 index.css 拆分为
      # src/index.css + src/styles/* 后的实测基线（占位 55 / z-index 36 /
      # 5005 行，index.css 与 styles/ 合计）。偿还债务后应同步下调阈值；
      # 确需上调须在 PR 中说明理由。
      # important 49→0（2026-10 全量偿还）：三方内斗根源（Post.tsx 渲染器
      #   内联样式 + dark:! 工具类 + base.css 分层 important）已清除，排版
      #   收拢为 article.css 未分层单一事实源；KaTeX 用 .article-body 前缀
      #   specificity 压制运行时注入的 katex.min.css。新增 important 直接挂。
      # 行数 4997→5005：z-index 语义档位表（base.css :root，14 token）+ a11y
      #   修复 + important 偿还的层叠知识注释（净额持平，见 PR）。
      # z-index 已 token 化：CSS 内裸数字仅允许容器内层白名单值 0/1/3/10，
      # TSX 内仅允许 z-10（图标层）；新浮层一律用 var(--z-*) 档位。
      - name: CSS budget check (ratchet)
        run: |
          CSS_FILES="src/index.css src/styles/*.css"
          PLACEHOLDERS=$(grep -hE '/\* \((repaired comment|乱码注释已清理)\) \*/' $CSS_FILES | wc -l)
          IMPORTANTS=$(cat $CSS_FILES | grep -o '!important' | wc -l)
          ZINDEX=$(cat $CSS_FILES | grep -o 'z-index:' | wc -l)
          LINES=$(cat $CSS_FILES | wc -l)
          ZINDEX_BAD=$(grep -hE 'z-index: [0-9]+' $CSS_FILES | grep -vcE 'z-index: (0|1|3|10);[[:space:]]*$' || true)
          ZINDEX_TSX_BAD=$(grep -rhoE 'z-\[?[0-9]+' src --include='*.tsx' | grep -vcE 'z-10$' || true)
          echo "css placeholders=$PLACEHOLDERS importants=$IMPORTANTS z-index=$ZINDEX zindex_raw_bad=$ZINDEX_BAD zindex_tsx_bad=$ZINDEX_TSX_BAD lines=$LINES"
          test "$PLACEHOLDERS" -le 55
          test "$IMPORTANTS" -le 0
          test "$ZINDEX" -le 36
          test "$ZINDEX_BAD" -eq 0
          test "$ZINDEX_TSX_BAD" -eq 0
          test "$LINES" -le 5005

  # 生产构建 + 预渲染产物校验
  build:
    name: Build & Prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        run: npx playwright install chromium --with-deps

      - name: Build (vite build + prerender + rss/sitemap)
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -f dist/categories/index.html
          test -f dist/weekly/index.html
          test -f dist/posts/markdown-syntax-test/index.html
          test -f dist/posts/typescript-advanced/index.html
          test -f dist/rss.xml
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q "markdown-syntax-test" dist/sitemap.xml
          grep -q "/weekly" dist/sitemap.xml
          echo "All build artifacts verified."

      - name: Upload dist snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: dist/
          retention-days: 7

  # 端到端测试（Chromium 桌面 + 移动视口）
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
