<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>项目进度卡片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'Noto Sans SC',"PingFang SC","Microsoft YaHei",sans-serif; }
        :root {
            --card-width: 420px;
            /* 苹果极简风，白底蓝绿强调 */
            --bg-page:  #f0f4f8;
            --bg-card:  #ffffff;
            --bg-panel: #f8fafc;
            --accent:   #0ea5e9;
            --done:     #22c55e;
            --doing:    #f59e0b;
            --todo:     #cbd5e1;
            --overdue:  #ef4444;
            --text-pri: #0f172a;
            --text-sec: #475569;
            --text-dim: #94a3b8;
            --border:   #e2e8f0;
            --border-radius: 24px;
        }
        body {
            background: var(--bg-page);
            display:flex; flex-direction:column; align-items:center;
            min-height:100vh; padding:40px 20px; gap:28px;
        }
        .poster-wrapper {
            width:100%; max-width:var(--card-width); border-radius:var(--border-radius);
            box-shadow: 0 1px 0 rgba(255,255,255,0.90), 0 0 0 1px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.10);
        }
        .poster-container {
            width:100%; background:var(--bg-card); border-radius:var(--border-radius);
            overflow:hidden; min-height:800px; display:flex; flex-direction:column;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.90);
        }

        /* 顶部蓝色横栏 */
        .proj-header {
            background:linear-gradient(160deg,#0369a1,#0ea5e9);
            padding:22px 24px 20px; flex-shrink:0; position:relative; overflow:hidden;
        }
        .proj-header::after {
            content:attr(data-progress); position:absolute;
            right:-10px; bottom:-18px;
            font-size:90px; font-weight:900; color:rgba(255,255,255,0.06);
            line-height:1; font-family:'JetBrains Mono',monospace;
        }
        .proj-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
        .proj-tag {
            font-size:9px; font-weight:700; letter-spacing:2px;
            color:rgba(255,255,255,0.80); background:rgba(255,255,255,0.15);
            border:1px solid rgba(255,255,255,0.25); padding:3px 10px; border-radius:4px;
        }
        .proj-deadline { font-size:10px; color:rgba(255,255,255,0.65); letter-spacing:0.5px; }
        .proj-title { font-size:20px; font-weight:900; color:#fff; line-height:1.35; margin-bottom:14px; }

        /* 整体进度大条 */
        .overall-bar-wrap { display:flex; align-items:center; gap:10px; }
        .overall-track {
            flex:1; height:8px; background:rgba(255,255,255,0.20);
            border-radius:4px; overflow:hidden;
        }
        .overall-fill { height:100%; border-radius:4px; background:#fff; }
        .overall-pct { font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:#fff; }

        /* 内容区 */
        .body { flex:1; display:flex; flex-direction:column; padding:20px 22px 18px; gap:14px; }

        /* 四状态汇总 */
        .status-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; flex-shrink:0; }
        .status-cell {
            background:var(--bg-panel); border:1px solid var(--border);
            border-radius:10px; padding:10px 8px; text-align:center;
            position:relative; overflow:hidden;
        }
        .status-cell::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
        .sc-done::before  { background:var(--done); }
        .sc-doing::before { background:var(--doing); }
        .sc-todo::before  { background:var(--todo); }
        .sc-over::before  { background:var(--overdue); }
        .status-num { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; line-height:1; margin-bottom:3px; }
        .sc-done  .status-num { color:var(--done); }
        .sc-doing .status-num { color:var(--doing); }
        .sc-todo  .status-num { color:var(--text-dim); }
        .sc-over  .status-num { color:var(--overdue); }
        .status-label { font-size:9.5px; color:var(--text-dim); }

        /* 里程碑列表 */
        .section-title { font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--text-dim); flex-shrink:0; }

        .milestone-list { flex:1; display:flex; flex-direction:column; gap:8px; }

        .milestone {
            display:flex; align-items:flex-start; gap:12px;
            background:var(--bg-panel); border:1px solid var(--border);
            border-radius:12px; padding:12px 14px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.80);
            flex:1;
        }
        /* 左侧状态圆点 */
        .ms-dot {
            width:28px; height:28px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:12px; flex-shrink:0; margin-top:1px;
        }
        .ms-done  .ms-dot { background:#dcfce7; color:var(--done); }
        .ms-doing .ms-dot { background:#fef3c7; color:var(--doing); }
        .ms-todo  .ms-dot { background:#f1f5f9; color:var(--text-dim); }
        .ms-over  .ms-dot { background:#fee2e2; color:var(--overdue); }

        .ms-body { flex:1; }
        .ms-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
        .ms-name { font-size:13px; font-weight:700; color:var(--text-pri); flex:1; }
        .ms-badge {
            font-size:9px; font-weight:700; padding:2px 7px; border-radius:4px;
            white-space:nowrap; flex-shrink:0;
        }
        .ms-done  .ms-badge { background:#dcfce7; color:var(--done); }
        .ms-doing .ms-badge { background:#fef3c7; color:var(--doing); }
        .ms-todo  .ms-badge { background:#f1f5f9; color:var(--text-dim); }
        .ms-over  .ms-badge { background:#fee2e2; color:var(--overdue); }

        .ms-progress-wrap { display:flex; align-items:center; gap:8px; }
        .ms-track { flex:1; height:4px; background:#e2e8f0; border-radius:2px; overflow:hidden; }
        .ms-fill  { height:100%; border-radius:2px; }
        .ms-done  .ms-fill  { background:var(--done); }
        .ms-doing .ms-fill  { background:var(--doing); }
        .ms-todo  .ms-fill  { background:var(--todo); }
        .ms-over  .ms-fill  { background:var(--overdue); }
        .ms-pct { font-size:10px; color:var(--text-dim); min-width:28px; text-align:right; }

        .ms-date { font-size:10px; color:var(--text-dim); margin-top:4px; }

        /* 底部 */
        .footer { flex-shrink:0; padding:12px 22px; border-top:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-between; background:var(--bg-panel); }
        .footer-brand { font-size:10px; color:var(--text-dim); letter-spacing:1px; }
        .footer-updated { font-size:10px; color:var(--accent); font-family:'JetBrains Mono',monospace; }

        /* 下载 */
        .action-wrapper { width:100%; max-width:var(--card-width); display:flex; justify-content:center; }
        .download-btn {
            background:var(--accent); color:#fff; border:none; border-radius:50px;
            padding:14px 36px; font-size:14px; font-weight:600;
            font-family:'Noto Sans SC',sans-serif; cursor:pointer;
            display:flex; align-items:center; gap:10px;
            box-shadow:0 4px 16px rgba(14,165,233,0.30); transition:all 0.2s ease;
        }
        .download-btn:hover  { transform:translateY(-2px); box-shadow:0 6px 20px rgba(14,165,233,0.42); }
        .download-btn:active { transform:scale(0.96); }
        .download-btn:disabled { opacity:0.50; cursor:not-allowed; transform:none; }
        .download-btn svg { width:17px; height:17px; fill:currentColor; }
    </style>
</head>
<body>
<div class="poster-wrapper">
  <div class="poster-container" id="poster">
    <div class="content-layer" style="display:contents">
      <!-- ===== 用户数据区，修改这里的文字即可 ===== -->

      <!-- 顶部项目头 data-progress 填整体进度百分比 -->
      <div class="proj-header" data-progress="68%">
        <div class="proj-meta">
          <span class="proj-tag">PROJECT</span>
          <span class="proj-deadline">截止 2026-05-31</span>
        </div>
        <h1 class="proj-title">Claude Code Skills<br>工具库建设项目</h1>
        <div class="overall-bar-wrap">
          <div class="overall-track"><div class="overall-fill" style="width:68%"></div></div>
          <span class="overall-pct">68%</span>
        </div>
      </div>

      <div class="body">

        <!-- 四状态汇总 -->
        <div class="status-grid">
          <div class="status-cell sc-done">
            <div class="status-num">12</div>
            <div class="status-label">已完成</div>
          </div>
          <div class="status-cell sc-doing">
            <div class="status-num">5</div>
            <div class="status-label">进行中</div>
          </div>
          <div class="status-cell sc-todo">
            <div class="status-num">8</div>
            <div class="status-label">待开始</div>
          </div>
          <div class="status-cell sc-over">
            <div class="status-num">2</div>
            <div class="status-label">已逾期</div>
          </div>
        </div>

        <div class="section-title">关键里程碑</div>

        <div class="milestone-list">
          <div class="milestone ms-done">
            <div class="ms-dot">✓</div>
            <div class="ms-body">
              <div class="ms-top"><span class="ms-name">基础模板库搭建</span><span class="ms-badge">已完成</span></div>
              <div class="ms-progress-wrap"><div class="ms-track"><div class="ms-fill" style="width:100%"></div></div><span class="ms-pct">100%</span></div>
              <div class="ms-date">完成于 2026-02-28</div>
            </div>
          </div>
          <div class="milestone ms-doing">
            <div class="ms-dot">⟳</div>
            <div class="ms-body">
              <div class="ms-top"><span class="ms-name">设计规范文档完善</span><span class="ms-badge">进行中</span></div>
              <div class="ms-progress-wrap"><div class="ms-track"><div class="ms-fill" style="width:72%"></div></div><span class="ms-pct">72%</span></div>
              <div class="ms-date">预计 2026-04-15 完成</div>
            </div>
          </div>
          <div class="milestone ms-doing">
            <div class="ms-dot">⟳</div>
            <div class="ms-body">
              <div class="ms-top"><span class="ms-name">AI 评测模板专项</span><span class="ms-badge">进行中</span></div>
              <div class="ms-progress-wrap"><div class="ms-track"><div class="ms-fill" style="width:45%"></div></div><span class="ms-pct">45%</span></div>
              <div class="ms-date">预计 2026-04-30 完成</div>
            </div>
          </div>
          <div class="milestone ms-over">
            <div class="ms-dot">!</div>
            <div class="ms-body">
              <div class="ms-top"><span class="ms-name">多语言适配</span><span class="ms-badge">已逾期</span></div>
              <div class="ms-progress-wrap"><div class="ms-track"><div class="ms-fill" style="width:20%"></div></div><span class="ms-pct">20%</span></div>
              <div class="ms-date">原计划 2026-03-10，已逾期 11 天</div>
            </div>
          </div>
        </div>

      </div>

      <div class="footer">
        <span class="footer-brand">项目管理看板</span>
        <span class="footer-updated">更新于 03-21</span>
      </div>

      <!-- ===== 数据区结束 ===== -->
    </div>
  </div>
</div>
<div class="action-wrapper">
  <button class="download-btn" id="downloadBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span id="btnText">保存为高清图片</span>
  </button>
</div>
<script>
  const btn=document.getElementById('downloadBtn'),btnTxt=document.getElementById('btnText'),poster=document.getElementById('poster');
  btn.addEventListener('click',()=>{
    const orig=btnTxt.innerText; btnTxt.innerText='正在生成超清原图...'; btn.disabled=true;
    htmlToImage.toPng(poster,{pixelRatio:3,style:{transform:'none'}})
    .then(d=>{const a=document.createElement('a');a.download='card-project-progress.png';a.href=d;a.click();btnTxt.innerText='保存成功 ✅';setTimeout(()=>{btnTxt.innerText=orig;btn.disabled=false;},2000);})
    .catch(e=>{console.error(e);btnTxt.innerText='生成失败，请重试';setTimeout(()=>{btnTxt.innerText=orig;btn.disabled=false;},2000);});
  });
</script>
</body>
</html>
