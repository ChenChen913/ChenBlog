<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>健康数据卡片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'Noto Sans SC',"PingFang SC","Microsoft YaHei",sans-serif; }
        :root {
            --card-width: 420px;
            /* 森林大地配色 */
            --bg-page:  #e8ede8;
            --bg-card:  linear-gradient(160deg, #f2f6f2 0%, #ffffff 100%);
            --accent:   #3d6b5a;
            --accent-2: #22c55e;
            --accent-3: #f59e0b;
            --accent-4: #ef4444;
            --blob-1:   #7c9e8f;
            --blob-2:   #b5cdc4;
            --blob-3:   #d4e2de;
            --text-pri: #1a2e26;
            --text-sec: #4d6b5f;
            --text-dim: #8aaa9d;
            --border:   rgba(61,107,90,0.12);
            --border-radius: 28px;
        }
        body {
            background: var(--bg-page);
            background-image: radial-gradient(circle, rgba(61,107,90,0.08) 1px, transparent 1px);
            background-size: 22px 22px;
            display:flex; flex-direction:column; align-items:center;
            min-height:100vh; padding:40px 20px; gap:28px;
        }
        .poster-wrapper {
            width:100%; max-width:var(--card-width); border-radius:var(--border-radius);
            box-shadow: 0 2px 0 rgba(255,255,255,0.90), 0 16px 48px rgba(61,107,90,0.14), 0 4px 12px rgba(0,0,0,0.06);
        }
        .poster-container {
            position:relative; width:100%; background:var(--bg-card);
            border-radius:var(--border-radius); padding:36px 24px 28px;
            min-height:800px; overflow:hidden; display:flex; flex-direction:column;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.90);
        }
        .blob { position:absolute; border-radius:50%; filter:blur(52px); opacity:0.32; animation:float 10s ease-in-out infinite; }
        .blob-1 { width:240px; height:240px; background:var(--blob-1); top:-60px; left:-60px; animation-delay:0s; }
        .blob-2 { width:200px; height:200px; background:var(--blob-2); bottom:-50px; right:-50px; animation-delay:4s; }
        .blob-3 { width:150px; height:150px; background:var(--blob-3); top:43%; left:35%; animation-delay:8s; }
        @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-14px) rotate(5deg)} }
        .content-layer { position:relative; z-index:10; flex:1; display:flex; flex-direction:column; }

        /* 标题 */
        .header { margin-bottom:20px; flex-shrink:0; }
        .date-tag {
            display:inline-block; font-size:10px; font-weight:700; letter-spacing:1.5px;
            color:var(--accent); background:rgba(61,107,90,0.08);
            border:1px solid var(--border); padding:3px 10px; border-radius:20px; margin-bottom:10px;
        }
        .main-title { font-size:22px; font-weight:900; color:var(--text-pri); line-height:1.35; margin-bottom:6px; }
        .sub-title { font-size:11.5px; color:var(--text-sec); }

        /* 核心指标：步数环形进度 + 右侧卡路里/距离 */
        .hero-row {
            display:flex; align-items:center; gap:20px;
            background:rgba(255,255,255,0.70); backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.85); border-radius:20px;
            padding:20px; margin-bottom:16px; flex-shrink:0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 4px 16px rgba(0,0,0,0.05);
        }

        /* SVG 环形进度 */
        .ring-wrap { position:relative; flex-shrink:0; width:100px; height:100px; }
        .ring-wrap svg { transform:rotate(-90deg); }
        .ring-bg   { fill:none; stroke:#e2e8f0; stroke-width:10; }
        .ring-fill { fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round;
                     stroke-dasharray:283; stroke-dashoffset:90; /* 283*(1-0.68)=90 */
                     transition:stroke-dashoffset 0s; }
        .ring-center {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
        }
        .ring-value { font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--accent); line-height:1; }
        .ring-unit  { font-size:9px; color:var(--text-dim); margin-top:2px; }

        .hero-right { flex:1; display:flex; flex-direction:column; gap:10px; }
        .hero-stat { display:flex; flex-direction:column; gap:2px; }
        .hs-label { font-size:10px; color:var(--text-dim); letter-spacing:0.5px; }
        .hs-val { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--text-pri); line-height:1; }
        .hs-unit { font-size:10px; color:var(--text-sec); margin-left:2px; }
        .hero-divider { width:100%; height:1px; background:var(--border); }

        /* 指标网格 */
        .metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; flex-shrink:0; }
        .metric-card {
            background:rgba(255,255,255,0.78); backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.90); border-radius:16px;
            padding:14px 15px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 2px 8px rgba(0,0,0,0.04);
            position:relative; overflow:hidden;
        }
        .metric-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
        .mc-sleep::before  { background:var(--accent); }
        .mc-heart::before  { background:var(--accent-4); }
        .mc-weight::before { background:var(--accent-3); }
        .mc-water::before  { background:#3b82f6; }

        .mc-icon  { font-size:20px; margin-bottom:6px; display:block; }
        .mc-label { font-size:10px; color:var(--text-dim); letter-spacing:0.5px; margin-bottom:4px; }
        .mc-value { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--text-pri); line-height:1; }
        .mc-unit  { font-size:11px; color:var(--text-sec); margin-left:2px; }
        .mc-sub   { font-size:10px; color:var(--text-dim); margin-top:3px; }
        .mc-bar-track { height:3px; background:#e2e8f0; border-radius:2px; margin-top:8px; overflow:hidden; }
        .mc-bar-fill  { height:100%; border-radius:2px; }
        .mc-sleep  .mc-bar-fill  { background:var(--accent); width:78%; }
        .mc-heart  .mc-bar-fill  { background:var(--accent-4); width:62%; }
        .mc-weight .mc-bar-fill  { background:var(--accent-3); width:85%; }
        .mc-water  .mc-bar-fill  { background:#3b82f6; width:50%; }

        /* 周趋势小图（用色块模拟柱状图）*/
        .week-row {
            flex-shrink:0;
            background:rgba(255,255,255,0.70); backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.85); border-radius:16px;
            padding:14px 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 2px 8px rgba(0,0,0,0.04);
        }
        .week-title { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:10px; }
        .week-bars { display:flex; align-items:flex-end; gap:6px; height:44px; }
        .week-col  { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
        .week-bar  { width:100%; border-radius:3px 3px 0 0; background:var(--accent); opacity:0.30; }
        .week-bar.active { opacity:1; }
        .week-day  { font-size:9px; color:var(--text-dim); }

        /* 底部 */
        .footer { flex-shrink:0; margin-top:16px; padding-top:14px; border-top:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-between; }
        .footer-brand { font-size:10px; color:var(--text-dim); letter-spacing:1px; }
        .footer-score { font-size:11px; font-weight:700; color:var(--accent); }

        /* 下载 */
        .action-wrapper { width:100%; max-width:var(--card-width); display:flex; justify-content:center; }
        .download-btn {
            background:var(--accent); color:#fff; border:none; border-radius:50px;
            padding:14px 36px; font-size:14px; font-weight:600;
            font-family:'Noto Sans SC',sans-serif; cursor:pointer;
            display:flex; align-items:center; gap:10px;
            box-shadow:0 4px 0 rgba(29,80,62,0.40), 0 8px 20px rgba(61,107,90,0.28);
            transition:all 0.15s ease;
        }
        .download-btn:hover  { transform:translateY(-2px); box-shadow:0 6px 0 rgba(29,80,62,0.40), 0 12px 28px rgba(61,107,90,0.35); }
        .download-btn:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(29,80,62,0.40); }
        .download-btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; }
        .download-btn svg { width:17px; height:17px; fill:currentColor; }
    </style>
</head>
<body>
<div class="poster-wrapper">
  <div class="poster-container" id="poster">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
    <div class="content-layer">
      <!-- ===== 用户数据区，修改这里的文字即可 ===== -->
      <div class="header">
        <span class="date-tag">2026年3月21日 · 今日数据</span>
        <h1 class="main-title">健康运动日报</h1>
        <p class="sub-title">今天表现不错，继续保持 💪</p>
      </div>

      <!-- 步数环 + 卡路里 -->
      <div class="hero-row">
        <div class="ring-wrap">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle class="ring-bg"   cx="50" cy="50" r="45"/>
            <!-- stroke-dashoffset = 283*(1-完成率)，完成率68%时为90 -->
            <circle class="ring-fill" cx="50" cy="50" r="45" style="stroke-dashoffset:72"/>
          </svg>
          <div class="ring-center">
            <span class="ring-value">8,426</span>
            <span class="ring-unit">步 / 目标1万</span>
          </div>
        </div>
        <div class="hero-right">
          <div class="hero-stat">
            <span class="hs-label">消耗卡路里</span>
            <div><span class="hs-val">486</span><span class="hs-unit">千卡</span></div>
          </div>
          <div class="hero-divider"></div>
          <div class="hero-stat">
            <span class="hs-label">运动距离</span>
            <div><span class="hs-val">6.2</span><span class="hs-unit">公里</span></div>
          </div>
        </div>
      </div>

      <!-- 四项指标 -->
      <div class="metrics-grid">
        <div class="metric-card mc-sleep">
          <span class="mc-icon">😴</span>
          <div class="mc-label">睡眠时长</div>
          <div><span class="mc-value">7.8</span><span class="mc-unit">小时</span></div>
          <div class="mc-sub">深睡 2.1h · 质量良好</div>
          <div class="mc-bar-track"><div class="mc-bar-fill"></div></div>
        </div>
        <div class="metric-card mc-heart">
          <span class="mc-icon">❤️</span>
          <div class="mc-label">静息心率</div>
          <div><span class="mc-value">68</span><span class="mc-unit">bpm</span></div>
          <div class="mc-sub">正常范围 60-80</div>
          <div class="mc-bar-track"><div class="mc-bar-fill"></div></div>
        </div>
        <div class="metric-card mc-weight">
          <span class="mc-icon">⚖️</span>
          <div class="mc-label">体重</div>
          <div><span class="mc-value">68.5</span><span class="mc-unit">kg</span></div>
          <div class="mc-sub">↓ 较上周 -0.3kg</div>
          <div class="mc-bar-track"><div class="mc-bar-fill"></div></div>
        </div>
        <div class="metric-card mc-water">
          <span class="mc-icon">💧</span>
          <div class="mc-label">饮水量</div>
          <div><span class="mc-value">1,200</span><span class="mc-unit">ml</span></div>
          <div class="mc-sub">目标 2,400ml · 50%</div>
          <div class="mc-bar-track"><div class="mc-bar-fill"></div></div>
        </div>
      </div>

      <!-- 本周步数趋势 -->
      <div class="week-row">
        <div class="week-title">本周步数趋势</div>
        <div class="week-bars">
          <div class="week-col"><div class="week-bar" style="height:60%"></div><span class="week-day">周一</span></div>
          <div class="week-col"><div class="week-bar" style="height:45%"></div><span class="week-day">周二</span></div>
          <div class="week-col"><div class="week-bar" style="height:80%"></div><span class="week-day">周三</span></div>
          <div class="week-col"><div class="week-bar" style="height:35%"></div><span class="week-day">周四</span></div>
          <div class="week-col"><div class="week-bar" style="height:90%"></div><span class="week-day">周五</span></div>
          <div class="week-col"><div class="week-bar" style="height:55%"></div><span class="week-day">周六</span></div>
          <!-- 今天：active 高亮 -->
          <div class="week-col"><div class="week-bar active" style="height:84%"></div><span class="week-day">今天</span></div>
        </div>
      </div>

      <div class="footer">
        <span class="footer-brand">健康日报 · AI 运动助手</span>
        <span class="footer-score">综合评分 82 分 🌿</span>
      </div>
      <!-- ===== 数据区结束 ===== -->
    </div>
  </div>
</div>
<div class="action-wrapper">
  <button class="download-btn" id="downloadBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span id="btnText">保存为高清图片</span>
  </button>
</div>
<script>
  const btn=document.getElementById('downloadBtn'),btnTxt=document.getElementById('btnText'),poster=document.getElementById('poster');
  btn.addEventListener('click',()=>{
    const orig=btnTxt.innerText; btnTxt.innerText='正在生成超清原图...'; btn.disabled=true;
    const blobs=poster.querySelectorAll('.blob'); blobs.forEach(b=>b.style.animation='none');
    htmlToImage.toPng(poster,{pixelRatio:3,style:{transform:'none'}})
    .then(d=>{const a=document.createElement('a');a.download='card-health.png';a.href=d;a.click();btnTxt.innerText='保存成功 ✅';setTimeout(()=>{btnTxt.innerText=orig;btn.disabled=false;blobs.forEach(b=>b.style.animation='');},2000);})
    .catch(e=>{console.error(e);btnTxt.innerText='生成失败，请重试';blobs.forEach(b=>b.style.animation='');setTimeout(()=>{btnTxt.innerText=orig;btn.disabled=false;},2000);});
  });
</script>
</body>
</html>
