<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>转化漏斗卡片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'Noto Sans SC',"PingFang SC","Microsoft YaHei",sans-serif; }
        :root {
            --card-width: 420px;
            /* 暮光蓝紫配色 */
            --bg-page:   #f0eef8;
            --bg-card:   linear-gradient(160deg, #f5f3ff 0%, #ffffff 100%);
            --accent:    #4a4080;
            --accent-lt: rgba(74,64,128,0.08);
            --blob-1:    #6b5fb5;
            --blob-2:    #9e95d0;
            --blob-3:    #c4bfe8;
            --text-pri:  #1a1530;
            --text-sec:  #5a5080;
            --text-dim:  #a090c0;
            --border-radius: 28px;
            /* 漏斗各层颜色（从上到下渐淡） */
            --f1: #4a4080;
            --f2: #6b5fb5;
            --f3: #8b7fd0;
            --f4: #ab9fe8;
        }
        body {
            background: var(--bg-page);
            background-image: radial-gradient(circle, rgba(107,95,181,0.10) 1px, transparent 1px);
            background-size: 22px 22px;
            display:flex; flex-direction:column; align-items:center;
            min-height:100vh; padding:40px 20px; gap:28px;
        }
        .poster-wrapper {
            width:100%; max-width:var(--card-width);
            border-radius:var(--border-radius);
            box-shadow: 0 2px 0 rgba(255,255,255,0.90),
                        0 16px 48px rgba(74,64,128,0.14),
                        0 4px 12px rgba(0,0,0,0.06);
        }
        .poster-container {
            position:relative; width:100%;
            background: var(--bg-card);
            border-radius:var(--border-radius);
            padding:36px 24px 30px;
            min-height:800px; overflow:hidden;
            display:flex; flex-direction:column;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.90);
        }
        .blob { position:absolute; border-radius:50%; filter:blur(55px); opacity:0.28; animation:float 11s ease-in-out infinite; }
        .blob-1 { width:240px; height:240px; background:var(--blob-1); top:-60px; left:-60px; animation-delay:0s; }
        .blob-2 { width:200px; height:200px; background:var(--blob-2); bottom:-50px; right:-50px; animation-delay:4s; }
        .blob-3 { width:150px; height:150px; background:var(--blob-3); top:44%; left:36%; animation-delay:8s; }
        @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-14px) rotate(5deg)} }
        .content-layer { position:relative; z-index:10; flex:1; display:flex; flex-direction:column; }

        /* 标题区 */
        .header { margin-bottom:24px; flex-shrink:0; }
        .kicker { font-size:10px; font-weight:700; letter-spacing:2.5px; color:var(--accent); margin-bottom:8px; }
        .main-title { font-size:22px; font-weight:900; color:var(--text-pri); line-height:1.35; margin-bottom:6px; }
        .sub-title { font-size:11.5px; color:var(--text-sec); line-height:1.55; }

        /* 总转化率大数字 */
        .total-row {
            display:flex; align-items:center; justify-content:space-between;
            background:rgba(74,64,128,0.06); border:1px solid rgba(74,64,128,0.12);
            border-radius:14px; padding:14px 18px; margin-bottom:20px; flex-shrink:0;
        }
        .total-label { font-size:11px; color:var(--text-sec); }
        .total-rate {
            font-family:'JetBrains Mono',monospace;
            font-size:28px; font-weight:700; color:var(--accent);
        }
        .total-trend { font-size:11px; color:#16a34a; font-weight:600; }

        /* 漏斗容器 */
        .funnel { flex:1; display:flex; flex-direction:column; gap:4px; }

        /* 单层漏斗 */
        .funnel-step { position:relative; }

        .funnel-bar-wrap {
            display:flex; align-items:center; gap:12px; margin-bottom:4px;
        }
        /* 漏斗梯形色块（用 padding 控制缩进模拟梯形）*/
        .funnel-bar {
            height:44px; border-radius:8px;
            display:flex; align-items:center; padding:0 14px;
            flex:1; position:relative; overflow:hidden;
            box-shadow: 0 2px 0 rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.20);
        }
        .step-1 .funnel-bar { background:var(--f1); margin:0; }
        .step-2 .funnel-bar { background:var(--f2); margin:0 12px; }
        .step-3 .funnel-bar { background:var(--f3); margin:0 24px; }
        .step-4 .funnel-bar { background:var(--f4); margin:0 36px; }

        .bar-label { font-size:12px; font-weight:700; color:rgba(255,255,255,0.95); flex:1; }
        .bar-value {
            font-family:'JetBrains Mono',monospace;
            font-size:14px; font-weight:700; color:#fff;
        }

        /* 步骤间转化箭头 */
        .funnel-arrow {
            display:flex; align-items:center; justify-content:center;
            gap:8px; padding:2px 0; flex-shrink:0;
        }
        .arrow-line { flex:1; height:1px; background:rgba(74,64,128,0.15); }
        .arrow-rate {
            font-size:10px; font-weight:700;
            color:var(--text-dim); letter-spacing:0.5px;
            white-space:nowrap;
        }
        .arrow-icon { font-size:12px; color:var(--text-dim); }

        /* 底部洞察 */
        .insight {
            flex-shrink:0; margin-top:18px;
            background:rgba(74,64,128,0.05); border:1px solid rgba(74,64,128,0.10);
            border-radius:12px; padding:12px 14px;
            font-size:12px; color:var(--text-sec); line-height:1.62;
        }
        .insight b { color:var(--text-pri); font-weight:600; }

        /* 底部署名 */
        .footer { flex-shrink:0; margin-top:16px; display:flex; align-items:center; justify-content:space-between; }
        .footer-brand { font-size:10px; color:var(--text-dim); letter-spacing:1px; }
        .footer-date  { font-size:10px; color:var(--text-dim); }

        /* 下载 */
        .action-wrapper { width:100%; max-width:var(--card-width); display:flex; justify-content:center; }
        .download-btn {
            background:var(--accent); color:#fff; border:none; border-radius:50px;
            padding:14px 36px; font-size:14px; font-weight:600;
            font-family:'Noto Sans SC',sans-serif; cursor:pointer;
            display:flex; align-items:center; gap:10px;
            box-shadow:0 4px 16px rgba(74,64,128,0.30); transition:all 0.2s ease;
        }
        .download-btn:hover  { transform:translateY(-2px); box-shadow:0 6px 22px rgba(74,64,128,0.42); }
        .download-btn:active { transform:scale(0.96); }
        .download-btn:disabled { opacity:0.50; cursor:not-allowed; transform:none; }
        .download-btn svg { width:17px; height:17px; fill:currentColor; }
    </style>
</head>
<body>
<div class="poster-wrapper">
  <div class="poster-container" id="poster">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
    <div class="content-layer">
      <!-- ===== 用户数据区，修改这里的文字即可 ===== -->
      <div class="header">
        <p class="kicker">CONVERSION FUNNEL · 2026.03</p>
        <h1 class="main-title">商品详情页<br>转化漏斗分析</h1>
        <p class="sub-title">本月累计曝光至成交全链路数据</p>
      </div>

      <div class="total-row">
        <span class="total-label">曝光→成交 综合转化率</span>
        <span class="total-rate">3.2%</span>
        <span class="total-trend">↑ +0.4%</span>
      </div>

      <div class="funnel">
        <!-- 第一层 -->
        <div class="funnel-step step-1">
          <div class="funnel-bar-wrap">
            <div class="funnel-bar">
              <span class="bar-label">曝光量</span>
              <span class="bar-value">1,280,000</span>
            </div>
          </div>
        </div>
        <div class="funnel-arrow">
          <div class="arrow-line"></div>
          <span class="arrow-icon">▼</span>
          <span class="arrow-rate">点击率 18.4%</span>
          <div class="arrow-line"></div>
        </div>

        <!-- 第二层 -->
        <div class="funnel-step step-2">
          <div class="funnel-bar-wrap">
            <div class="funnel-bar">
              <span class="bar-label">点击进入</span>
              <span class="bar-value">235,500</span>
            </div>
          </div>
        </div>
        <div class="funnel-arrow">
          <div class="arrow-line"></div>
          <span class="arrow-icon">▼</span>
          <span class="arrow-rate">加购率 23.1%</span>
          <div class="arrow-line"></div>
        </div>

        <!-- 第三层 -->
        <div class="funnel-step step-3">
          <div class="funnel-bar-wrap">
            <div class="funnel-bar">
              <span class="bar-label">加入购物车</span>
              <span class="bar-value">54,400</span>
            </div>
          </div>
        </div>
        <div class="funnel-arrow">
          <div class="arrow-line"></div>
          <span class="arrow-icon">▼</span>
          <span class="arrow-rate">支付率 75.6%</span>
          <div class="arrow-line"></div>
        </div>

        <!-- 第四层 -->
        <div class="funnel-step step-4">
          <div class="funnel-bar-wrap">
            <div class="funnel-bar">
              <span class="bar-label">成交订单</span>
              <span class="bar-value">41,130</span>
            </div>
          </div>
        </div>
      </div>

      <div class="insight">
        <b>关键流失点：</b>加购→支付 环节流失率最低（75.6% 支付率），主要流失发生在<b>点击→加购</b>环节，建议优化详情页内容与定价策略。
      </div>

      <div class="footer">
        <span class="footer-brand">数据报告 · 电商分析</span>
        <span class="footer-date">2026 年 3 月</span>
      </div>
      <!-- ===== 数据区结束 ===== -->
    </div>
  </div>
</div>
<div class="action-wrapper">
  <button class="download-btn" id="downloadBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span id="btnText">保存为高清图片</span>
  </button>
</div>
<script>
  const btn=document.getElementById('downloadBtn'), btnTxt=document.getElementById('btnText'), poster=document.getElementById('poster');
  btn.addEventListener('click',()=>{
    const orig=btnTxt.innerText; btnTxt.innerText='正在生成超清原图...'; btn.disabled=true;
    const blobs=poster.querySelectorAll('.blob'); blobs.forEach(b=>b.style.animation='none');
    htmlToImage.toPng(poster,{pixelRatio:3,style:{transform:'none'}})
    .then(d=>{const a=document.createElement('a');a.download='card-funnel.png';a.href=d;a.click();btnTxt.innerText='保存成功 ✅';setTimeout(()=>{btnTxt.innerText=orig;btn.disabled=false;blobs.forEach(b=>b.style.animation='');},2000);})
    .catch(e=>{console.error(e);btnTxt.innerText='生成失败，请重试';blobs.forEach(b=>b.style.animation='');setTimeout(()=>{btnTxt.innerText=orig;btn.disabled=false;},2000);});
  });
</script>
</body>
</html>
